<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spinify</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Inter,sans-serif;
      min-height:100vh;
      background:linear-gradient(135deg,#0f0c29,#1a0533,#0d1b2a);
      color:#f1f5f9;
      overflow-x:hidden;
    }

    .blob{
      position:fixed;
      border-radius:50%;
      filter:blur(40px);
      z-index:0;
    }

    .blob1{
      width:500px;
      height:500px;
      background:rgba(168,85,247,0.15);
      top:-120px;
      left:-120px;
    }

    .blob2{
      width:600px;
      height:600px;
      background:rgba(6,182,212,0.12);
      bottom:-200px;
      right:-200px;
    }

    nav{
      position:sticky;
      top:0;
      z-index:100;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:16px 24px;
      backdrop-filter:blur(12px);
      background:rgba(255,255,255,0.05);
      border-bottom:1px solid rgba(255,255,255,0.1);
    }

    .logo{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .logo-box{
      width:40px;
      height:40px;
      border-radius:12px;
      background:linear-gradient(135deg,#a855f7,#06b6d4);
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:20px;
    }

    .logo h1{
      font-size:24px;
      font-weight:800;
      background:linear-gradient(90deg,#a855f7,#ec4899,#06b6d4);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .container{
      max-width:1200px;
      margin:auto;
      padding:24px;
      position:relative;
      z-index:1;
    }

    .layout{
      display:grid;
      grid-template-columns:1fr 350px;
      gap:24px;
    }

    .glass{
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.1);
      backdrop-filter:blur(12px);
      border-radius:24px;
    }

    .wheel-card{
      padding:24px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:20px;
    }

    .stats{
      width:100%;
      display:flex;
      gap:12px;
    }

    .stat{
      flex:1;
      background:rgba(255,255,255,0.05);
      border-radius:14px;
      padding:12px;
      text-align:center;
    }

    .stat h3{
      color:#a855f7;
      font-size:24px;
    }

    .stat p{
      font-size:12px;
      color:#94a3b8;
    }

    .wheel-wrapper{
      position:relative;
      width:420px;
      height:420px;
    }

    canvas{
      width:100%;
      height:100%;
    }

    .pointer{
      position:absolute;
      top:-12px;
      left:50%;
      transform:translateX(-50%);
      z-index:5;
    }

    .pointer div{
      width:0;
      height:0;
      border-left:16px solid transparent;
      border-right:16px solid transparent;
      border-top:40px solid #a855f7;
      filter:drop-shadow(0 0 10px #a855f7);
    }

    .spin-center{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      width:70px;
      height:70px;
      border-radius:50%;
      border:none;
      background:linear-gradient(135deg,#a855f7,#7c3aed);
      color:white;
      font-weight:700;
      cursor:pointer;
      z-index:5;
      box-shadow:0 0 24px rgba(168,85,247,0.6);
    }

    .main-spin{
      width:100%;
      padding:16px;
      border:none;
      border-radius:16px;
      background:linear-gradient(135deg,#a855f7,#ec4899,#06b6d4);
      color:white;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 0 30px rgba(168,85,247,0.4);
    }

    .names-panel{
      padding:20px;
      display:flex;
      flex-direction:column;
      gap:16px;
      height:fit-content;
    }

    .input-row{
      display:flex;
      gap:10px;
    }

    input{
      flex:1;
      padding:12px;
      border-radius:12px;
      border:none;
      background:rgba(255,255,255,0.08);
      color:white;
      outline:none;
    }

    .add-btn{
      width:52px;
      border:none;
      border-radius:12px;
      background:linear-gradient(135deg,#a855f7,#7c3aed);
      color:white;
      font-size:22px;
      cursor:pointer;
    }

    .buttons{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .small-btn{
      padding:8px 14px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.1);
      background:rgba(255,255,255,0.05);
      color:#cbd5e1;
      cursor:pointer;
      font-size:13px;
    }

    .danger{
      color:#f43f5e;
      border-color:rgba(244,63,94,0.3);
    }

    .list{
      max-height:450px;
      overflow:auto;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .person{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px;
      border-radius:12px;
      background:rgba(255,255,255,0.03);
    }

    .badge{
      width:32px;
      height:32px;
      border-radius:10px;
      background:linear-gradient(135deg,#a855f7,#06b6d4);
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:12px;
      font-weight:700;
    }

    .person span{
      flex:1;
    }

    .person button{
      background:none;
      border:none;
      color:#94a3b8;
      cursor:pointer;
      font-size:16px;
    }

    .winner-modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.7);
      display:none;
      justify-content:center;
      align-items:center;
      z-index:1000;
      backdrop-filter:blur(6px);
    }

    .winner-box{
      width:90%;
      max-width:400px;
      padding:40px;
      text-align:center;
      border-radius:30px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.1);
      backdrop-filter:blur(20px);
      animation:pop .4s ease;
    }

    .winner-box h2{
      font-size:40px;
      margin-top:10px;
      background:linear-gradient(90deg,#a855f7,#ec4899,#06b6d4);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .winner-box button{
      margin-top:20px;
      padding:12px 28px;
      border:none;
      border-radius:999px;
      background:linear-gradient(135deg,#a855f7,#ec4899);
      color:white;
      font-weight:700;
      cursor:pointer;
    }

    @keyframes pop{
      from{
        transform:scale(.5);
        opacity:0;
      }
      to{
        transform:scale(1);
        opacity:1;
      }
    }

    @media(max-width:900px){
      .layout{
        grid-template-columns:1fr;
      }

      .wheel-wrapper{
        width:100%;
        max-width:420px;
        height:auto;
        aspect-ratio:1;
      }
    }
  </style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>

<nav>
  <div class="logo">
    <div class="logo-box">🎯</div>
    <h1>Spinify</h1>
  </div>
</nav>

<div class="container">
  <div class="layout">

    <div class="glass wheel-card">

      <div class="stats">
        <div class="stat">
          <h3 id="count">0</h3>
          <p>Participants</p>
        </div>

        <div class="stat">
          <h3 id="spinCount">0</h3>
          <p>Spins</p>
        </div>
      </div>

      <div class="wheel-wrapper">

        <div class="pointer">
          <div></div>
        </div>

        <canvas id="wheel" width="420" height="420"></canvas>

        <button class="spin-center" onclick="spinWheel()">SPIN</button>
      </div>

      <button class="main-spin" onclick="spinWheel()">
        🎯 SPIN THE WHEEL
      </button>

    </div>

    <div class="glass names-panel">

      <div class="input-row">
        <input type="text" id="nameInput" placeholder="Add a name...">
        <button class="add-btn" onclick="addName()">+</button>
      </div>

      <div class="buttons">
        <button class="small-btn" onclick="shuffleNames()">🔀 Shuffle</button>
        <button class="small-btn danger" onclick="clearAll()">🗑 Clear All</button>
      </div>

      <div class="list" id="nameList"></div>

    </div>

  </div>
</div>

<div class="winner-modal" id="winnerModal">
  <div class="winner-box">
    <div style="font-size:70px;">🎉</div>
    <p>Winner</p>
    <h2 id="winnerText"></h2>
    <button onclick="closeWinner()">Awesome!</button>
  </div>
</div>

<script>

const themes = ["#a855f7","#ec4899","#06b6d4","#8b5cf6","#f43f5e","#3b82f6","#10b981","#f59e0b"];

let names = [
  "Alice",
  "Bob",
  "Charlie",
  "Diana",
  "Ethan",
  "Fiona",
  "George",
  "Hannah"
];

let rotation = 0;
let spinning = false;
let spinCounter = 0;

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

function drawWheel(){

  ctx.clearRect(0,0,420,420);

  const cx = 210;
  const cy = 210;
  const radius = 200;

  const slice = (Math.PI*2)/names.length;

  names.forEach((name,i)=>{

    const start = rotation + i*slice;
    const end = start + slice;

    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,radius,start,end);
    ctx.closePath();

    ctx.fillStyle = themes[i % themes.length];
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.2)";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();

    ctx.translate(
      cx + Math.cos(start + slice/2)*130,
      cy + Math.sin(start + slice/2)*130
    );

    ctx.rotate(start + slice/2 + Math.PI/2);

    ctx.fillStyle = "white";
    ctx.font = "bold 16px Inter";
    ctx.textAlign = "center";

    let text = name;
    if(text.length > 12){
      text = text.slice(0,10) + "...";
    }

    ctx.fillText(text,0,0);

    ctx.restore();

  });

  ctx.beginPath();
  ctx.arc(cx,cy,35,0,Math.PI*2);
  ctx.fillStyle = "#fff";
  ctx.fill();

  ctx.fillStyle = "#7c3aed";
  ctx.font = "bold 12px Inter";
  ctx.textAlign = "center";
  ctx.fillText("SPIN",cx,214);
}

drawWheel();

function renderNames(){

  const list = document.getElementById("nameList");
  list.innerHTML = "";

  names.forEach((name,index)=>{

    const item = document.createElement("div");
    item.className = "person";

    item.innerHTML = `
      <div class="badge">${index+1}</div>
      <span contenteditable="true"
        onblur="editName(${index}, this.innerText)">
        ${name}
      </span>

      <button onclick="removeName(${index})">✕</button>
    `;

    list.appendChild(item);

  });

  document.getElementById("count").innerText = names.length;

  drawWheel();
}

renderNames();

function addName(){

  const input = document.getElementById("nameInput");

  const val = input.value.trim();

  if(!val) return;

  names.push(val);

  input.value = "";

  renderNames();
}

function removeName(index){

  names.splice(index,1);

  renderNames();
}

function editName(index,val){

  names[index] = val.trim() || names[index];

  renderNames();
}

function clearAll(){

  if(confirm("Clear all names?")){

    names = [];

    renderNames();
  }
}

function shuffleNames(){

  names.sort(()=>Math.random()-0.5);

  renderNames();
}

function spinWheel(){

  if(spinning) return;

  if(names.length < 2){
    alert("Add at least 2 names");
    return;
  }

  spinning = true;

  spinCounter++;

  document.getElementById("spinCount").innerText = spinCounter;

  const winnerIndex = Math.floor(Math.random()*names.length);

  const slice = (Math.PI*2)/names.length;

  const target =
    (Math.PI*12) +
    ((Math.PI*2) - (winnerIndex*slice) - slice/2);

  const start = rotation;

  const duration = 4000;

  const startTime = performance.now();

  function animate(now){

    const elapsed = now - startTime;

    const t = Math.min(elapsed/duration,1);

    const ease = 1 - Math.pow(1-t,4);

    rotation = start + target*ease;

    drawWheel();

    if(t < 1){

      requestAnimationFrame(animate);

    }else{

      spinning = false;

      showWinner(names[winnerIndex]);
    }
  }

  requestAnimationFrame(animate);
}

function showWinner(name){

  document.getElementById("winnerText").innerText = name;

  document.getElementById("winnerModal").style.display = "flex";
}

function closeWinner(){

  document.getElementById("winnerModal").style.display = "none";
}

document
  .getElementById("nameInput")
  .addEventListener("keydown",e=>{

    if(e.key === "Enter"){

      addName();
    }
  });

window.addEventListener("keydown",e=>{

  if(e.code === "Space"){

    e.preventDefault();

    spinWheel();
  }
});

</script>

</body>
</html>
